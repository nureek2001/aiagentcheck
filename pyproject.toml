[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kmg-security-agent"
version = "1.0.0"
description = "Requirement-driven security review with DeepSeek and CI/CD gating"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.7"]

[project.scripts]
kmg-agent = "kmg_agent.cli:main"

[tool.setuptools.packages.find]
include = ["kmg_agent*"]

[tool.setuptools.package-data]
kmg_agent = ["resources/*.json", "resources/*.md", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["targets", "reports", ".venv"]
force-exclude = true
