# Copy ONLY into an authorised product repository; do not modify the organiser target.
# Replace YOUR_TEAM/YOUR_AGENT and FULL_TRUSTED_AGENT_COMMIT_SHA in both locations.
name: Product security
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: product-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  security:
    # Fork PRs have no API secret and fail closed until a trusted review is arranged.
    uses: YOUR_TEAM/YOUR_AGENT/.github/workflows/reusable-security.yml@FULL_TRUSTED_AGENT_COMMIT_SHA
    with:
      agent_repository: YOUR_TEAM/YOUR_AGENT
      agent_ref: FULL_TRUSTED_AGENT_COMMIT_SHA
      target_repository: ${{ github.repository }}
      target_ref: ${{ github.sha }}
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  delivery:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Replace with your authorised deployment steps.'
